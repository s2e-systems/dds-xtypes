name: 1 - Run Interoperability Tests
run-name: Run Interoperability Tests
on:
  workflow_dispatch:
    inputs:
      publishers:
        description: Publishers to use
        type: string
        default: '["connext_dds","toc_coredx_dds", "eclipse_cyclone"]'
      subscribers:
        description: Subscribers to use
        type: string
        default: '["connext_dds","toc_coredx_dds", "eclipse_cyclone"]'
jobs:
  generate_timestamp:
    runs-on: ubuntu-latest
    steps:
    - name: Generate timestamp file
      run: date '+%Y-%m-%d-%H_%M_%S' > timestamp
    - name: Upload timestamp file
      uses: actions/upload-artifact@v5
      with:
        name: timestamp
        path: |
          ./timestamp

  run_tests:
    runs-on: ubuntu-latest
    needs: generate_timestamp
    strategy:
      matrix:
        publisher: ${{ fromJson(github.event.inputs.publishers) }}
        subscriber: ${{ fromJson(github.event.inputs.subscribers) }}

    steps:
    - name: Checkout sources
      uses: actions/checkout@v5
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11.4'
    - name: Download shape_main executables
      uses: robinraju/release-downloader@v1.10
      with:
        latest: true
        fileName: "*"
        out-file-path: zipped_executables
    - name: Unzip executables
      run: unzip 'zipped_executables/*.zip' -d executables
    - name: Install Python requirements
      run: pip install --requirement requirements.txt
    - name: Run Interoperability script
      timeout-minutes: 120
      continue-on-error: true
      run: |
        publisher_exe=executables/${{ matrix.publisher }}*test_main_linux
        subscriber_exe=executables/${{ matrix.subscriber }}*test_main_linux
        extra_args=""
        # Check if publisher executable exists
        if ! ls $publisher_exe 1> /dev/null 2>&1; then
          echo "ERROR: Publisher executable not found: $publisher_exe"
          exit 1
        fi
        # Check if subscriber executable exists
        if ! ls $subscriber_exe 1> /dev/null 2>&1; then
          echo "ERROR: Subscriber executable not found: $subscriber_exe"
          exit 1
        fi
        if [[ "${subscriber_exe,,}" == *opendds* && "${publisher_exe,,}" == *connext_dds* ]]; then
          extra_args="--periodic-announcement 5000"
        fi
        # Run interoperability tests (xcdr1, type_object_version 1)
        output_file=junit_report_xcdr1_to1-${{ matrix.publisher }}-${{ matrix.subscriber }}.xml
        python3 interoperability_report.py --pub-exe $publisher_exe --sub-exe $subscriber_exe -o $output_file $extra_args --type-object-version 1 -x 1
        # Run interoperability tests (xcdr1, type_object_version 2)
        output_file=junit_report_xcdr1_to2-${{ matrix.publisher }}-${{ matrix.subscriber }}.xml
        python3 interoperability_report.py --pub-exe $publisher_exe --sub-exe $subscriber_exe -o $output_file $extra_args --type-object-version 2 -x 1
        # Run interoperability tests (xcdr2, type_object_version 1)
        output_file=junit_report_xcdr2_to1-${{ matrix.publisher }}-${{ matrix.subscriber }}.xml
        python3 interoperability_report.py --pub-exe $publisher_exe --sub-exe $subscriber_exe -o $output_file $extra_args --type-object-version 1 -x 2
        # Run interoperability tests (xcdr2, type_object_version 2)
        output_file=junit_report_xcdr2_to2-${{ matrix.publisher }}-${{ matrix.subscriber }}.xml
        python3 interoperability_report.py --pub-exe $publisher_exe --sub-exe $subscriber_exe -o $output_file $extra_args --type-object-version 2 -x 2
        # Run TypeId tests (type_object_version 1)
        output_file=junit_typeid_report_to1-${{ matrix.publisher }}-${{ matrix.subscriber }}.xml
        python3 interoperability_report.py --pub-exe $publisher_exe --sub-exe $subscriber_exe -o $output_file $extra_args --enable-typeid-tests --type-object-version 1
        # Run TypeId tests (type_object_version 2)
        output_file=junit_typeid_report_to2-${{ matrix.publisher }}-${{ matrix.subscriber }}.xml
        python3 interoperability_report.py --pub-exe $publisher_exe --sub-exe $subscriber_exe -o $output_file $extra_args --enable-typeid-tests --type-object-version 2
    - name: Download timestamp
      uses: actions/download-artifact@v5
      with:
        name: timestamp
    - name: Upload report
      uses: actions/upload-artifact@v5
      with:
        name: junit_report-${{ matrix.publisher }}-${{ matrix.subscriber }}
        path: |
          ./junit_report_xcdr1_to1-${{ matrix.publisher }}-${{ matrix.subscriber }}.xml
          ./junit_report_xcdr1_to2-${{ matrix.publisher }}-${{ matrix.subscriber }}.xml
          ./junit_report_xcdr2_to1-${{ matrix.publisher }}-${{ matrix.subscriber }}.xml
          ./junit_report_xcdr2_to2-${{ matrix.publisher }}-${{ matrix.subscriber }}.xml
          ./junit_typeid_report_to1-${{ matrix.publisher }}-${{ matrix.subscriber }}.xml
          ./junit_typeid_report_to2-${{ matrix.publisher }}-${{ matrix.subscriber }}.xml
          ./timestamp

  generate_report:
    runs-on: ubuntu-latest
    needs: run_tests
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Download artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: junit_report-*
          merge-multiple: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.4'
      - name: Install Python requirements
        run: pip install --requirement requirements.txt
      - name: Merge reports and generate xlsx
        run: |
          junitparser merge junit_report_xcdr1_to1-*.xml junit_xtypes_interoperability_report_xcdr1_to1.xml
          python3 generate_xlsx_report.py --input junit_xtypes_interoperability_report_xcdr1_to1.xml --output xtypes_interoperability_report_xcdr1_to1.xlsx
          junitparser merge junit_report_xcdr1_to2-*.xml junit_xtypes_interoperability_report_xcdr1_to2.xml
          python3 generate_xlsx_report.py --input junit_xtypes_interoperability_report_xcdr1_to2.xml --output xtypes_interoperability_report_xcdr1_to2.xlsx
          junitparser merge junit_report_xcdr2_to1-*.xml junit_xtypes_interoperability_report_xcdr2_to1.xml
          python3 generate_xlsx_report.py --input junit_xtypes_interoperability_report_xcdr2_to1.xml --output xtypes_interoperability_report_xcdr2_to1.xlsx
          junitparser merge junit_report_xcdr2_to2-*.xml junit_xtypes_interoperability_report_xcdr2_to2.xml
          python3 generate_xlsx_report.py --input junit_xtypes_interoperability_report_xcdr2_to2.xml --output xtypes_interoperability_report_xcdr2_to2.xlsx
          junitparser merge junit_typeid_report_to1-*.xml junit_xtypes_typeid_interoperability_report_to1.xml
          python3 generate_xlsx_report.py --input junit_xtypes_typeid_interoperability_report_to1.xml --output xtypes_typeid_interoperability_report_to1.xlsx
          junitparser merge junit_typeid_report_to2-*.xml junit_xtypes_typeid_interoperability_report_to2.xml
          python3 generate_xlsx_report.py --input junit_xtypes_typeid_interoperability_report_to2.xml --output xtypes_typeid_interoperability_report_to2.xlsx
      - name: Generate HTML report (xcdr1_to1)
        uses: AutoModality/action-xunit-viewer@v1
        with:
          results: ./junit_xtypes_interoperability_report_xcdr1_to1.xml
          output: ./xtypes_interoperability_report_xcdr1_to1.html
          fail: false
      - name: Generate HTML report (xcdr1_to2)
        uses: AutoModality/action-xunit-viewer@v1
        with:
          results: ./junit_xtypes_interoperability_report_xcdr1_to2.xml
          output: ./xtypes_interoperability_report_xcdr1_to2.html
          fail: false
      - name: Generate HTML report (xcdr2_to1)
        uses: AutoModality/action-xunit-viewer@v1
        with:
          results: ./junit_xtypes_interoperability_report_xcdr2_to1.xml
          output: ./xtypes_interoperability_report_xcdr2_to1.html
          fail: false
      - name: Generate HTML report (xcdr2_to2)
        uses: AutoModality/action-xunit-viewer@v1
        with:
          results: ./junit_xtypes_interoperability_report_xcdr2_to2.xml
          output: ./xtypes_interoperability_report_xcdr2_to2.html
          fail: false
      - name: Generate HTML report (TypeId to1)
        uses: AutoModality/action-xunit-viewer@v1
        with:
          results: ./junit_xtypes_typeid_interoperability_report_to1.xml
          output: ./xtypes_typeid_interoperability_report_to1.html
          fail: false
      - name: Generate HTML report (TypeId to2)
        uses: AutoModality/action-xunit-viewer@v1
        with:
          results: ./junit_xtypes_typeid_interoperability_report_to2.xml
          output: ./xtypes_typeid_interoperability_report_to2.html
          fail: false
      - name: Download timestamp
        uses: actions/download-artifact@v5
        with:
          name: timestamp
      - name: Attach the report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: complete_xtypes_interoperability_report
          path: |
            ./xtypes_interoperability_report_xcdr1_to1.html
            ./junit_xtypes_interoperability_report_xcdr1_to1.xml
            ./xtypes_interoperability_report_xcdr1_to1.xlsx
            ./xtypes_interoperability_report_xcdr1_to2.html
            ./junit_xtypes_interoperability_report_xcdr1_to2.xml
            ./xtypes_interoperability_report_xcdr1_to2.xlsx
            ./xtypes_interoperability_report_xcdr2_to1.html
            ./junit_xtypes_interoperability_report_xcdr2_to1.xml
            ./xtypes_interoperability_report_xcdr2_to1.xlsx
            ./xtypes_interoperability_report_xcdr2_to2.html
            ./junit_xtypes_interoperability_report_xcdr2_to2.xml
            ./xtypes_interoperability_report_xcdr2_to2.xlsx
            ./xtypes_typeid_interoperability_report_to1.html
            ./junit_xtypes_typeid_interoperability_report_to1.xml
            ./xtypes_typeid_interoperability_report_to1.xlsx
            ./xtypes_typeid_interoperability_report_to2.html
            ./junit_xtypes_typeid_interoperability_report_to2.xml
            ./xtypes_typeid_interoperability_report_to2.xlsx
            ./timestamp
